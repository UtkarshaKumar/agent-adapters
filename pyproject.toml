[project]
name = "agent-adapters"
version = "0.1.0"
description = "Multi-agent orchestration adapters for Composio"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "google-genai>=0.8.0",
    "openai>=1.0.0",
    "agentops>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
